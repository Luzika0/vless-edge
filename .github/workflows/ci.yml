name: CI

on:
  push:
    branches:
      - main
      - feature/complete-vless-worker
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate UDP relay syntax
        run: node --check relay/server.mjs

      - name: Build UDP relay container
        run: docker build -t vless-udp-relay ./relay

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
